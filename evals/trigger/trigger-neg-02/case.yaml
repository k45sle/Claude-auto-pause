schema_version: "1.1"
name: trigger-neg-02
tags: [trigger]
runs: 1
execution:
  max_turns: 4
  allowed_tools: [Skill]
  prompt: "draft a PR description for a change that renames getUser to fetchUser across the API client"
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?writing-handoffs"'
    min: 0
    max: 0
    arm: both
