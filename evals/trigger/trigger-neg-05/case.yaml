schema_version: "1.1"
name: trigger-neg-05
tags: [trigger]
runs: 1
execution:
  max_turns: 4
  allowed_tools: [Skill]
  prompt: "write release notes for our 2.0 launch: new dashboard, dark mode, faster search"
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?writing-handoffs"'
    min: 0
    max: 0
    arm: both
