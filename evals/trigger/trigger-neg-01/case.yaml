schema_version: "1.1"
name: trigger-neg-01
tags: [trigger]
runs: 1
execution:
  max_turns: 4
  allowed_tools: [Skill]
  prompt: "write a changelog entry for v1.4: added CSV export, fixed the timezone bug in reports"
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?writing-handoffs"'
    min: 0
    max: 0
    arm: both
