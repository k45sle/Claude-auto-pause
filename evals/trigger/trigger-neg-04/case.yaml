schema_version: "1.1"
name: trigger-neg-04
tags: [trigger]
runs: 1
execution:
  max_turns: 4
  allowed_tools: [Skill]
  prompt: "write a commit message for: bump lodash to 4.17.21 to patch a prototype pollution CVE"
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?writing-handoffs"'
    min: 0
    max: 0
    arm: both
