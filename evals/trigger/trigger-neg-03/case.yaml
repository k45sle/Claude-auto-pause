schema_version: "1.1"
name: trigger-neg-03
tags: [trigger]
runs: 1
execution:
  max_turns: 4
  allowed_tools: [Skill]
  prompt: "summarize what we finished in this session: we shipped the login page and fixed two flaky tests"
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?writing-handoffs"'
    min: 0
    max: 0
    arm: both
